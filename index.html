  <style>
    /* ========================================
       SECTION 1: RESET & NORMALIZATION
       Complete CSS Reset and cross-browser fixes
       ======================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      height: 100%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    img, picture, video, canvas, svg {
      display: block;
      max-width: 100%;
    }

    input, button, textarea, select {
      font: inherit;
      color: inherit;
      background: transparent;
      border: none;
      outline: none;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul, ol {
      list-style: none;
    }

    /* ========================================
       SECTION 2: CSS CUSTOM PROPERTIES
       Theme system with 8 premium themes
       ======================================== */
    :root {
      /* Base Colors */
      --color-primary: #3b82f6;
      --color-primary-light: #60a5fa;
      --color-primary-dark: #2563eb;
      --color-secondary: #8b5cf6;
      --color-secondary-light: #a78bfa;
      --color-secondary-dark: #7c3aed;

      /* Semantic Colors */
      --color-success: #10b981;
      --color-success-light: #34d399;
      --color-warning: #f59e0b;
      --color-warning-light: #fbbf24;
      --color-danger: #ef4444;
      --color-danger-light: #f87171;
      --color-info: #06b6d4;
      --color-info-light: #22d3ee;

      /* Gradients */
      --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --gradient-secondary: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
      --gradient-success: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      --gradient-danger: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
      --gradient-warning: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
      --gradient-gold: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
      --shadow-2xl: 0 25px 50px rgba(0, 0, 0, 0.25);
      --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
      --shadow-glow-lg: 0 0 40px rgba(59, 130, 246, 0.4);

      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-base: 200ms ease;
      --transition-slow: 300ms ease;
      --transition-slower: 500ms ease;

      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --radius-full: 9999px;

      /* Spacing */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;

      /* Z-Index */
      --z-base: 1;
      --z-dropdown: 10;
      --z-sticky: 20;
      --z-fixed: 30;
      --z-modal-backdrop: 40;
      --z-modal: 50;
      --z-popover: 60;
      --z-tooltip: 70;
      --z-toast: 80;
      --z-overlay: 90;
      --z-max: 100;

      /* Theme-specific variables (default: dark) */
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --bg-elevated: rgba(30, 41, 59, 0.95);
      --bg-card: rgba(30, 41, 59, 0.8);
      --bg-input: rgba(255, 255, 255, 0.05);
      --bg-button: rgba(255, 255, 255, 0.1);

      --text-primary: #f8fafc;
      --text-secondary: rgba(248, 250, 252, 0.8);
      --text-tertiary: rgba(248, 250, 252, 0.6);
      --text-muted: rgba(248, 250, 252, 0.4);

      --border-color: rgba(71, 85, 105, 0.5);
      --border-color-light: rgba(71, 85, 105, 0.3);

      --glass-bg: rgba(15, 23, 42, 0.8);
      --glass-border: rgba(255, 255, 255, 0.1);

      --particle-color: #3b82f6;
      --glow-color: rgba(59, 130, 246, 0.4);
    }

    [data-theme="rgb"] {

      background: linear-gradient(135deg, #0a0010 0%, #100015 50%, #0a0010 100%);

    /* ========================================

       ======================================== */
    [data-theme="matrix"] {
      --bg-primary: #000000;
      --bg-secondary: #001400;

      --bg-elevated: rgba(0, 20, 0, 0.98);

      --bg-input: rgba(0, 255, 0, 0.03);
      --bg-button: rgba(0, 255, 0, 0.08);

      --text-primary: #00ff00;
      --text-secondary: rgba(0, 255, 0, 0.85);
      --text-tertiary: rgba(0, 255, 0, 0.65);
      --text-muted: rgba(0, 255, 0, 0.45);

      --border-color: rgba(0, 255, 0, 0.3);
      --border-color-light: rgba(0, 255, 0, 0.15);

      --glass-bg: rgba(0, 10, 0, 0.9);

      --particle-color: #00ff00;
      --glow-color: rgba(0, 255, 0, 0.5);

      --color-primary: #00ff00;
      --gradient-primary: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
      --shadow-glow: 0 0 30px rgba(0, 255, 0, 0.4);

      background: linear-gradient(180deg, #000000 0%, #001a00 50%, #000000 100%);
    }

    /* ========================================
       CYBERPUNK THEME (Purple/Yellow)
       ======================================== */
    [data-theme="cyberpunk"] {
      --bg-primary: #1a0a2e;
      --bg-secondary: #2d1b4e;
      --bg-tertiary: #3d2a5e;
      --bg-elevated: rgba(45, 27, 78, 0.95);
      --bg-card: rgba(61, 42, 94, 0.9);
      --bg-input: rgba(255, 215, 0, 0.05);
      --bg-button: rgba(255, 215, 0, 0.1);

      --text-primary: #ffd700;
      --text-secondary: rgba(255, 215, 0, 0.85);
      --text-tertiary: rgba(255, 215, 0, 0.65);
      --text-muted: rgba(255, 215, 0, 0.45);

      --border-color: rgba(255, 215, 0, 0.3);
      --border-color-light: rgba(255, 215, 0, 0.15);

      --glass-bg: rgba(26, 10, 46, 0.9);
      --glass-border: rgba(255, 215, 0, 0.2);

      --color-primary: #ffd700;
      --gradient-primary: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);

      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
    }

    /* ========================================
       ROYAL GOLD THEME (Premium/Luxury)
       ======================================== */
    [data-theme="royal"] {
      --bg-primary: #0f0a00;
      --bg-secondary: #1a1000;
      --bg-tertiary: #2d2000;
      --bg-elevated: rgba(26, 16, 0, 0.98);
      --bg-card: rgba(45, 32, 0, 0.95);
      --bg-input: rgba(255, 215, 0, 0.05);
      --bg-button: rgba(255, 215, 0, 0.1);

      --text-primary: #ffd700;
      --text-secondary: rgba(255, 215, 0, 0.85);
      --text-tertiary: rgba(255, 215, 0, 0.65);
      --text-muted: rgba(255, 215, 0, 0.45);

      --border-color: rgba(255, 215, 0, 0.35);
      --border-color-light: rgba(255, 215, 0, 0.2);

      --glass-bg: rgba(15, 10, 0, 0.9);
      --glass-border: rgba(255, 215, 0, 0.25);

      --particle-color: #ffd700;
      --glow-color: rgba(255, 215, 0, 0.5);

      --color-primary: #ffd700;
      --gradient-primary: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
      --shadow-glow: 0 0 30px rgba(255, 215, 0, 0.4);

      background: linear-gradient(180deg, #0f0a00 0%, #1a1000 50%, #0f0a00 100%);
    }

    /* ========================================
       LIGHT THEME (Clean/Modern)
       ======================================== */
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-tertiary: #e2e8f0;
      --bg-elevated: rgba(255, 255, 255, 0.95);
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-input: rgba(0, 0, 0, 0.03);
      --bg-button: rgba(59, 130, 246, 0.1);

      --text-primary: #0f172a;
      --text-secondary: rgba(15, 23, 42, 0.8);
      --text-tertiary: rgba(15, 23, 42, 0.6);
      --text-muted: rgba(15, 23, 42, 0.4);

      --border-color: rgba(203, 213, 225, 0.8);
      --border-color-light: rgba(203, 213, 225, 0.5);

      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(59, 130, 246, 0.1);

      --particle-color: #3b82f6;
      --glow-color: rgba(59, 130, 246, 0.3);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.08);
      --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.1);

      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 50%, #f0f4f8 100%);
    }

    /* ========================================
       SECTION 3: BASE LAYOUT
       Main app container and structure
       ======================================== */
    .app-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background var(--transition-slow), color var(--transition-slow);
    }

    /* ========================================
       SECTION 4: BACKGROUND EFFECTS
       Aurora, particles, and ambient effects
       ======================================== */
    .background-effects {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: var(--z-base);
      overflow: hidden;
    }

    /* Aurora Background */
    .aurora {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background:
        radial-gradient(ellipse at 20% 30%, var(--glow-color) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.2) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      animation: aurora-drift 25s ease-in-out infinite alternate;
      opacity: 0.6;
    }

    @keyframes aurora-drift {
      0% {
        transform: rotate(0deg) scale(1) translate(0, 0);
      }
      25% {
        transform: rotate(90deg) scale(1.05) translate(5%, -5%);
      }
      50% {
        transform: rotate(180deg) scale(1) translate(-5%, 5%);
      }
      75% {
        transform: rotate(270deg) scale(1.05) translate(-5%, -5%);
      }
      100% {
        transform: rotate(360deg) scale(1) translate(0, 0);
      }
    }

    /* Floating Particles */
    .particles-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--particle-color);
      border-radius: 50%;
      opacity: 0.4;
      animation: particle-float linear infinite;
      box-shadow: 0 0 10px var(--particle-color);
    }

    @keyframes particle-float {
      0% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: 0.3;
      }
      25% {
        transform: translateY(-25vh) translateX(20px) scale(1.2);
        opacity: 0.5;
      }
      50% {
        transform: translateY(-50vh) translateX(-20px) scale(1);
        opacity: 0.4;
      }
      75% {
        transform: translateY(-75vh) translateX(20px) scale(1.2);
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100vh) translateX(0) scale(1);
        opacity: 0;
      }
    }

    /* Grid Lines Effect */
    .grid-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(var(--border-color-light) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-color-light) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
      animation: grid-move 20s linear infinite;
    }

    @keyframes grid-move {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    /* Noise Texture Overlay */
    .noise-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ========================================
       SECTION 5: GLASSMORPHISM
       Frosted glass card effects
       ======================================== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .glass-strong {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-2xl);
      transition: all var(--transition-base);
    }

    .glass-card:hover {
      border-color: var(--border-color);
      box-shadow: var(--shadow-lg);
    }

    /* ========================================
       SECTION 6: HEADER COMPONENTS
       Time display and main header
       ======================================== */
    .main-header {
      position: relative;
      z-index: var(--z-sticky);
      padding: 56px 20px 16px;
      text-align: center;
      background: transparent;
    }

    .time-display-wrapper {
      position: relative;
      display: inline-block;
    }

    .time-display {
      font-size: 80px;
      font-weight: 200;
      letter-spacing: -4px;
      line-height: 1;
      text-shadow: 0 0 60px var(--glow-color);
      font-variant-numeric: tabular-nums;
      transition: text-shadow var(--transition-slow);
    }

    .time-display-seconds {
      position: absolute;
      top: 0;
      right: -40px;
      font-size: 24px;
      font-weight: 300;
      opacity: 0.5;
      letter-spacing: 0;
    }

    .date-display {
      font-size: 16px;
      font-weight: 400;
      opacity: 0.7;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .date-display-day {
      font-weight: 600;
    }

    /* ========================================
       SECTION 7: THEME BUTTON & PANEL
       Theme switching UI
       ======================================== */
    .theme-button {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: var(--z-fixed);
      width: 52px;
      height: 52px;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow-lg);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      color: white;
    }

    .theme-button:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 0 50px var(--glow-color);
    }

    .theme-button:active {
      transform: scale(0.95);
    }

    .theme-button svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .theme-panel {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: var(--z-fixed);
      background: var(--bg-elevated);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 16px;
      min-width: 200px;
      box-shadow: var(--shadow-2xl);
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      pointer-events: none;
      transition: all var(--transition-base);
    }

    .theme-panel.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .theme-panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .theme-option {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 4px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 12px;
      text-transform: capitalize;
    }

    .theme-option:hover {
      background: var(--bg-button);
    }

    .theme-option.active {
      background: var(--color-primary);
      color: white;
    }

    .theme-option-preview {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-color);
    }

    /* ========================================
       SECTION 8: SETTINGS BUTTON
       Quick settings access
       ======================================== */
    .settings-button {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: var(--z-fixed);
      width: 52px;
      height: 52px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-base);
      color: var(--text-secondary);
    }

    .settings-button:hover {
      background: var(--bg-button);
      color: var(--text-primary);
      transform: scale(1.05);
    }

    .settings-button svg {
      width: 24px;
      height: 24px;
      transition: transform var(--transition-slow);
    }

    .settings-button:hover svg {
      transform: rotate(90deg);
    }

    /* ========================================
       SECTION 9: CONTENT AREA
       Main scrollable content
       ======================================== */
    .content-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      z-index: var(--z-base);
      padding: 0 16px 100px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .content-area::-webkit-scrollbar {
      width: 6px;
    }

    .content-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .content-area::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: var(--radius-full);
    }

    .content-area::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .tab-content {
      display: none;
      animation: fadeIn var(--transition-base);
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========================================
       SECTION 10: BOTTOM NAVIGATION
       Tab bar with icons
       ======================================== */
    .bottom-navigation {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: var(--z-sticky);
      background: var(--bg-elevated);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-color);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      transition: transform var(--transition-base);
    }

    .navigation-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 500px;
      margin: 0 auto;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-tertiary);
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      border-radius: var(--radius-lg);
      transition: all var(--transition-base);
      min-width: 64px;
      position: relative;
    }

    .nav-tab svg {
      width: 24px;
      height: 24px;
      transition: transform var(--transition-fast);
    }

    .nav-tab:hover {
      background: var(--bg-button);
    }

    .nav-tab.active {
      color: var(--color-primary);
      background: rgba(59, 130, 246, 0.1);
    }

    .nav-tab.active svg {
      transform: scale(1.1);
    }

    .nav-tab::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 32px;
      height: 3px;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: transform var(--transition-base);
    }

    .nav-tab.active::after {
      transform: translateX(-50%) scaleX(1);
    }

    /* ========================================
       SECTION 11: CARDS
       Alarm and content cards
       ======================================== */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-2xl);
      padding: 20px;
      margin-bottom: 12px;
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .card:hover::before {
      opacity: 0.5;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color-light);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title svg {
      width: 24px;
      height: 24px;
      color: var(--color-primary);
    }

    /* ========================================
       SECTION 12: ALARM CARD
       Individual alarm item
       ======================================== */
    .alarm-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .alarm-info {
      flex: 1;
      cursor: pointer;
      padding: 4px 0;
    }

    .alarm-time {
      font-size: 42px;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .alarm-label {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .alarm-days {
      display: flex;
      gap: 6px;
    }

    .alarm-day {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
      background: var(--bg-button);
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .alarm-day.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .alarm-day.disabled {
      opacity: 0.4;
      background: transparent;
    }

    .alarm-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .alarm-badge {
      padding: 4px 10px;
      background: var(--bg-button);
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .alarm-badge.mission {
      background: rgba(139, 92, 246, 0.2);
      color: var(--color-secondary-light);
    }

    .alarm-badge.snooze {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    /* ========================================
       SECTION 13: TOGGLE SWITCH
       Custom toggle component
       ======================================== */
    .toggle-switch {
      position: relative;
      width: 56px;
      height: 30px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background var(--transition-base);
      flex-shrink: 0;
    }

    .toggle-switch.active {
      background: var(--color-primary);
    }

    .toggle-switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: var(--radius-full);
      transition: transform var(--transition-base);
      box-shadow: var(--shadow-md);
    }

    .toggle-switch.active .toggle-switch-knob {
      transform: translateX(26px);
    }

    /* ========================================
       SECTION 14: BUTTONS
       All button styles
       ======================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      transition: all var(--transition-base);
      text-decoration: none;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left var(--transition-slow);
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-glow);
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-glow-lg);
      transform: translateY(-2px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-button);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--bg-input);
      border-color: var(--color-primary);
    }

    .btn-danger {
      background: var(--gradient-danger);
      color: white;
    }

    .btn-danger:hover {
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
    }

    .btn-warning {
      background: var(--gradient-warning);
      color: #1a1a1a;
    }

    .btn-success {
      background: var(--gradient-success);
      color: white;
    }

    .btn-ghost {
      background: var(--bg-button);
      color: var(--text-primary);
    }

    .btn-ghost:hover {
      background: var(--bg-input);
    }

    .btn-block {
      width: 100%;
    }

    .btn-lg {
      padding: 18px 32px;
      font-size: 18px;
      border-radius: var(--radius-xl);
    }

    .btn-sm {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: var(--radius-md);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: var(--radius-full);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }

    .btn-icon:hover {
      background: var(--bg-button);
      color: var(--text-primary);
    }

    .btn-icon.danger:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .btn-icon.success:hover {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    /* ========================================
       SECTION 15: MODALS
       Overlay and modal windows
       ======================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal-backdrop);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-base);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--bg-elevated);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 24px));
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(100%);
      transition: transform var(--transition-slow);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color-light);
    }

    .modal-title {
      font-size: 24px;
      font-weight: 600;
    }

    .modal-body {
      padding-bottom: 16px;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color-light);
    }

    /* ========================================
       SECTION 16: FORM ELEMENTS
       Input fields and controls
       ======================================== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text-primary);
      transition: all var(--transition-fast);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input-lg {
      font-size: 24px;
      text-align: center;
      padding: 16px;
    }

    /* Time Input */
    .time-input-wrapper {
      text-align: center;
      margin-bottom: 24px;
    }

    input[type="time"] {
      font-size: 56px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      width: 100%;
      outline: none;
      font-variant-numeric: tabular-nums;
      font-weight: 200;
      letter-spacing: -2px;
      color-scheme: dark;
    }

    /* Number Input */
    input[type="number"] {
      color-scheme: dark;
    }

    /* Range Slider */
    .range-slider-wrapper {
      padding: 8px 0;
    }

    .range-slider {
      width: 100%;
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--gradient-primary);
      border-radius: var(--radius-full);
      cursor: pointer;
      box-shadow: var(--shadow-glow);
      transition: transform var(--transition-fast);
    }

    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .range-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      background: var(--gradient-primary);
      border-radius: var(--radius-full);
      cursor: pointer;
      border: none;
    }

    /* ========================================
       SECTION 17: CHIP SELECTORS
       Multi-select buttons
       ======================================== */
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 10px 16px;
      background: var(--bg-button);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip:hover {
      background: var(--bg-input);
      border-color: var(--color-primary);
    }

    .chip.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
    }

    .chip svg {
      width: 16px;
      height: 16px;
    }

    /* ========================================
       SECTION 18: ALARM RINGING SCREEN
       Full-screen alarm display
       ======================================== */
    .alarm-ringing-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-overlay);
      background: linear-gradient(180deg, #000 0%, #0a0a1a 50%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-slow);
    }

    .alarm-ringing-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .ringing-background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .ringing-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, rgba(139, 92, 246, 0.2) 30%, transparent 70%);
      animation: ringing-pulse 2s ease-in-out infinite;
    }

    @keyframes ringing-pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1;
      }
    }

    .ringing-particles {
      position: absolute;
      inset: 0;
    }

    .ringing-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--particle-color);
      border-radius: 50%;
      animation: ringing-particle-animation 1.5s ease-in-out infinite;
    }

    @keyframes ringing-particle-animation {
      0%, 100% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .ringing-content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .ringing-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ringing-shake 0.5s ease-in-out infinite;
      box-shadow: var(--shadow-glow-lg);
    }

    @keyframes ringing-shake {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }

    .ringing-icon svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    .ringing-time {
      font-size: 88px;
      font-weight: 200;
      letter-spacing: -4px;
      margin-bottom: 8px;
      text-shadow: 0 0 80px var(--glow-color);
      font-variant-numeric: tabular-nums;
    }

    .ringing-label {
      font-size: 28px;
      font-weight: 300;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .ringing-date {
      font-size: 16px;
      opacity: 0.5;
      margin-bottom: 48px;
    }

    /* Wave Visualizer */
    .wave-visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 100px;
      margin-bottom: 48px;
    }

    .wave-bar {
      width: 6px;
      background: linear-gradient(to top, var(--color-primary), var(--color-secondary));
      border-radius: var(--radius-full);
      animation: wave-animation 0.6s ease-in-out infinite alternate;
    }

    @keyframes wave-animation {
      from { height: 20px; }
      to { height: 80px; }
    }

    .ringing-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .snooze-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .snooze-btn {
      padding: 14px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .snooze-btn:hover {
      background: var(--bg-button);
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }

    .dismiss-btn {
      width: 240px;
      padding: 20px 40px;
      background: var(--gradient-danger);
      border-radius: var(--radius-xl);
      color: white;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-base);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
    }

    .dismiss-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px rgba(239, 68, 68, 0.5);
    }

    .mission-btn {
      width: 240px;
      padding: 20px 40px;
      background: var(--gradient-secondary);
      border-radius: var(--radius-xl);
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-base);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
    }

    .mission-btn:hover {
      transform: scale(1.05);
    }

    /* ========================================
       SECTION 19: MISSION MODAL
       Wake-up challenge UI
       ======================================== */
    .mission-modal-content {
      background: var(--bg-elevated);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: var(--radius-2xl);
      padding: 40px 32px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      margin: auto;
      box-shadow: var(--shadow-2xl);
    }

    .mission-header {
      margin-bottom: 32px;
    }

    .mission-icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--gradient-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: mission-pulse 1.5s ease-in-out infinite;
    }

    @keyframes mission-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .mission-icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    .mission-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mission-subtitle {
      font-size: 14px;
      opacity: 0.7;
    }

    .mission-question {
      font-size: 52px;
      font-weight: 300;
      margin: 32px 0;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      letter-spacing: 2px;
    }

    .mission-input {
      font-size: 32px;
      text-align: center;
      margin-bottom: 24px;
      padding: 18px;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    }

    .progress-circle {
      width: 200px;
      height: 200px;
      margin: 32px auto;
      position: relative;
    }

    .progress-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .progress-circle-bg {
      fill: none;
      stroke: var(--bg-tertiary);
      stroke-width: 10;
    }

    .progress-circle-active {
      fill: none;
      stroke: url(#progressGradient);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset var(--transition-base);
    }

    .progress-circle-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .progress-circle-label {
      font-size: 14px;
      opacity: 0.6;
    }

    /* Pattern Grid */
    .pattern-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 300px;
      margin: 24px auto;
    }

    .pattern-grid-item {
      aspect-ratio: 1;
      background: var(--bg-button);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      font-size: 32px;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pattern-grid-item:hover {
      background: var(--bg-input);
      transform: scale(1.05);
    }

    .pattern-output {
      min-height: 70px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      font-size: 36px;
      letter-spacing: 8px;
      text-align: center;
      margin: 16px 0;
    }

    /* ========================================
       SECTION 20: TIMER DISPLAY
       Timer and countdown UI
       ======================================== */
    .timer-display {
      text-align: center;
      padding: 48px 0;
    }

    .timer-time {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: -3px;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 60px var(--glow-color);
      margin-bottom: 32px;
    }

    .timer-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .timer-preset {
      padding: 16px;
      background: var(--bg-button);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--text-primary);
    }

    .timer-preset:hover {
      background: var(--bg-input);
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .timer-input {
      font-size: 28px;
      text-align: center;
      margin-bottom: 24px;
    }

    /* ========================================
       SECTION 21: STOPWATCH DISPLAY
       Stopwatch with laps
       ======================================== */
    .stopwatch-display {
      text-align: center;
      padding: 48px 0;
    }

    .stopwatch-time {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: -3px;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 60px var(--glow-color);
      margin-bottom: 8px;
    }

    .stopwatch-ms {
      font-size: 32px;
      opacity: 0.6;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      margin-bottom: 32px;
    }

    .stopwatch-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .lap-button {
      padding: 14px 28px;
      background: var(--bg-button);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .lap-button:hover:not(:disabled) {
      background: var(--bg-input);
      border-color: var(--color-primary);
    }

    .lap-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .laps-container {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 24px;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-input);
      border-radius: var(--radius-lg);
      margin-bottom: 8px;
      transition: all var(--transition-fast);
    }

    .lap-item:hover {
      background: var(--bg-button);
    }

    .lap-item-number {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.7;
    }

    .lap-item-time {
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    /* ========================================
       SECTION 22: WORLD CLOCK
       Global time zones
       ======================================== */
    .world-clock-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .world-clock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px;
      background: var(--bg-input);
      border-radius: var(--radius-lg);
      transition: all var(--transition-fast);
    }

    .world-clock-item:hover {
      background: var(--bg-button);
      transform: translateX(4px);
    }

    .world-clock-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .world-clock-city {
      font-size: 18px;
      font-weight: 600;
    }

    .world-clock-timezone {
      font-size: 12px;
      opacity: 0.6;
    }

    .world-clock-time {
      font-size: 32px;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      opacity: 0.9;
    }

    .world-clock-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .world-clock-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ========================================
       SECTION 23: POMODORO
       Focus timer
       ======================================== */
    .pomodoro-display {
      text-align: center;
      padding: 32px 0;
    }

    .pomodoro-mode-badge {
      display: inline-block;
      padding: 8px 24px;
      background: var(--bg-button);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
      color: var(--text-secondary);
    }

    .pomodoro-mode-badge.work {
      background: rgba(239, 68, 68, 0.15);
      color: var(--color-danger);
    }

    .pomodoro-mode-badge.break {
      background: rgba(16, 185, 129, 0.15);
      color: var(--color-success);
    }

    .pomodoro-time {
      font-size: 80px;
      font-weight: 200;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 80px var(--glow-color);
      margin-bottom: 24px;
    }

    .pomodoro-sessions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .pomodoro-session-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-color);
    }

    .pomodoro-session-dot.completed {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .pomodoro-session-dot.active {
      animation: pomodoro-active-dot 1s ease-in-out infinite;
    }

    @keyframes pomodoro-active-dot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .pomodoro-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color-light);
    }

    .pomodoro-stat {
      text-align: center;
    }

    .pomodoro-stat-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .pomodoro-stat-label {
      font-size: 12px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ========================================
       SECTION 24: HABIT TRACKER
       Daily habit tracking
       ======================================== */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-input);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 2px solid transparent;
    }

    .habit-item:hover {
      background: var(--bg-button);
      border-color: var(--border-color);
    }

    .habit-item.completed {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--color-success);
    }

    .habit-item.completed .habit-icon {
      background: var(--color-success);
    }

    .habit-icon {
      width: 48px;
      height: 48px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .habit-info {
      flex: 1;
    }

    .habit-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .habit-subtitle {
      font-size: 12px;
      opacity: 0.6;
    }

    .habit-streak {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(251, 146, 60, 0.15);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--warning);
    }

    .habit-check {
      width: 32px;
      height: 32px;
      display: none;
    }

    .habit-item.completed .habit-check {
      display: block;
      color: var(--color-success);
    }

    /* ========================================
       SECTION 25: WATER TRACKER
       Hydration reminder
       ======================================== */
    .water-tracker {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .water-glasses-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 16px;
    }

    .water-glass {
      width: 32px;
      height: 48px;
      border-radius: 4px 4px 8px 8px;
      background: var(--bg-input);
      transition: all var(--transition-base);
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .water-glass:hover {
      transform: translateY(-4px);
      border-color: var(--color-info);
    }

    .water-glass.filled {
      background: linear-gradient(to top, #0891b2, #06b6d4);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
    }

    .water-glass.filled::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30%;
      background: rgba(255, 255, 255, 0.3);
    }

    .water-controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .water-stats {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }

    .water-stat {
      text-align: center;
    }

    .water-stat-value {
      font-size: 32px;
      font-weight: 600;
      color: var(--color-info);
    }

    .water-stat-label {
      font-size: 12px;
      opacity: 0.6;
    }

    /* ========================================
       SECTION 26: FOCUS MODE
       Distraction-free focus
       ======================================== */
    .focus-mode-display {
      text-align: center;
      padding: 48px 0;
    }

    .focus-mode-circle {
      width: 240px;
      height: 240px;
      margin: 0 auto 32px;
      position: relative;
    }

    .focus-mode-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .focus-mode-circle-bg {
      fill: none;
      stroke: var(--bg-tertiary);
      stroke-width: 8;
    }

    .focus-mode-circle-active {
      fill: none;
      stroke: var(--color-primary);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 702;
      stroke-dashoffset: 702;
      transition: stroke-dashoffset 1s ease;
    }

    .focus-mode-circle-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .focus-mode-time {
      font-size: 48px;
      font-weight: 200;
      font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
      font-variant-numeric: tabular-nums;
    }

    .focus-mode-label {
      font-size: 12px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .focus-mode-input {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .focus-mode-input input {
      width: 100px;
      text-align: center;
      font-size: 32px;
      font-weight: 200;
    }

    /* ========================================
       SECTION 27: QUICK NOTES
       Simple note taking
       ======================================== */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-input-wrapper {
      display: flex;
      gap: 12px;
    }

    .note-input {
      flex: 1;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .note-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: var(--bg-input);
      border-radius: var(--radius-lg);
      transition: all var(--transition-fast);
    }

    .note-item:hover {
      background: var(--bg-button);
    }

    .note-content {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
    }

    .note-timestamp {
      font-size: 11px;
      opacity: 0.5;
      white-space: nowrap;
    }

    /* ========================================
       SECTION 28: INSTALL BANNER
       PWA installation prompt
       ======================================== */
    .install-banner {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      z-index: var(--z-toast);
      background: var(--bg-elevated);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-2xl);
      transform: translateY(200%);
      transition: transform var(--transition-slow);
    }

    .install-banner.visible {
      transform: translateY(0);
    }

    .install-banner-icon {
      width: 56px;
      height: 56px;
      background: var(--gradient-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: var(--shadow-glow);
    }

    .install-banner-content {
      flex: 1;
    }

    .install-banner-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .install-banner-subtitle {
      font-size: 13px;
      opacity: 0.7;
    }

    .install-banner-btn {
      padding: 12px 24px;
      white-space: nowrap;
    }

    /* ========================================
       SECTION 29: NOTIFICATION TOAST
       Slide-in notifications
       ======================================== */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: var(--z-toast);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .toast {
      background: var(--bg-elevated);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-xl);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
      max-width: 360px;
      opacity: 0;
      transform: translateX(100px);
      transition: all var(--transition-base);
      pointer-events: auto;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .toast-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast-icon.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--color-success);
    }

    .toast-icon.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--color-danger);
    }

    .toast-icon.warning {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .toast-icon.info {
      background: rgba(6, 182, 212, 0.15);
      color: var(--color-info);
    }

    .toast-content {
      flex: 1;
    }

    .toast-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .toast-message {
      font-size: 13px;
      opacity: 0.7;
    }

    /* ========================================
       SECTION 30: LOADING STATES
       Skeletons and spinners
       ======================================== */
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--bg-tertiary);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-dots {
      display: flex;
      gap: 6px;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      background: var(--color-primary);
      border-radius: 50%;
      animation: loading-dot 1s ease-in-out infinite;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.1s; }
    .loading-dot:nth-child(3) { animation-delay: 0.2s; }

    @keyframes loading-dot {
      0%, 100% { transform: scale(0.5); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.5s ease infinite;
      border-radius: var(--radius-md);
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 400% 0; }
      100% { background-position: -400% 0; }
    }

    /* ========================================
       SECTION 31: ANIMATIONS
       Keyframe animations library
       ======================================== */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
      20%, 40%, 60%, 80% { transform: translateX(8px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    @keyframes ripple {
      from { transform: scale(0); opacity: 1; }
      to { transform: scale(4); opacity: 0; }
    }

    /* Animation Classes */
    .animate-shake { animation: shake 0.6s ease-in-out; }
    .animate-bounce { animation: bounce 0.6s ease-in-out; }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .animate-spin { animation: spin 1s linear infinite; }

    /* ========================================
       SECTION 32: UTILITY CLASSES
       Helper classes
       ======================================== */
    .hidden { display: none !important; }
    .invisible { visibility: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }

    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-right { text-align: right; }

    .font-mono { font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; }

    .space-y-2 > * + * { margin-top: 8px; }
    .space-y-3 > * + * { margin-top: 12px; }

    .mt-2 { margin-top: 8px; }

    /* Safe Area */
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>

      missionComplete: false,

      // Intervals
      intervals: {
        clock: null,
        alarmCheck: null,
        timer: null,
        stopwatch: null,
        pomodoro: null,
        focus: null,
        worldClocks: null
      },

      // Audio
      audioContext: null,

      installPrompt: null,

    // ========================================================================
    // SECTION 2: UTILITY FUNCTIONS
    // Helper functions for common operations
    // ========================================================================
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function $(selector) {
      return document.querySelector(selector);
    }

    function $$(selector) {
      return document.querySelectorAll(selector);
    }

    function createElement(tag, className, innerHTML) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (innerHTML) el.innerHTML = innerHTML;
      return el;
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function formatStopwatch(ms) {
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const centiseconds = Math.floor((ms % 1000) / 10);
      return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
    }

    function formatWorldClockTime(timezone) {
      return new Date().toLocaleTimeString('en-US', {
        timeZone: timezone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    }

    function getDayName(day, full = false) {
      if (full) {
        return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][day];
      }
      return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][day];
    }

    function getMonthName(month) {
      return ['January', 'February', 'March', 'April', 'May', 'June',
              'July', 'August', 'September', 'October', 'November', 'December'][month];
    }

    // ========================================================================
    // SECTION 3: STORAGE FUNCTIONS
    // LocalStorage save/load operations
    // ========================================================================
    function saveToStorage(key, data) {
      localStorage.setItem(`ysn-${key}`, JSON.stringify(data));
    }

    function loadFromStorage(key) {
      const data = localStorage.getItem(`ysn-${key}`);
      return data ? JSON.parse(data) : null;
    }

    function saveAllData() {
      saveToStorage('theme', AppState.theme);
      saveToStorage('alarms', AppState.alarms);
      saveToStorage('worldclocks', AppState.worldClocks);
      saveToStorage('habits', AppState.habits);
      saveToStorage('notes', AppState.notes);
      saveToStorage('water', AppState.water);
      saveToStorage('pomodoro', AppState.pomodoro);
    }

    // ========================================================================
    // SECTION 4: AUDIO ENGINE
    // Sound generation and management
    // ========================================================================
    function stopAllAudio() {
      // Stop oscillator
      if (AppState.oscillator) {
        try {
          AppState.oscillator.stop();
          AppState.oscillator.disconnect();
        } catch (e) {}
        AppState.oscillator = null;
      }

      // Stop gain node
      if (AppState.gainNode) {
        try {
          AppState.gainNode.disconnect();
        } catch (e) {}
        AppState.gainNode = null;
      }

      // Close audio context
      if (AppState.audioContext) {
        try {
          AppState.audioContext.close();
        } catch (e) {}
        AppState.audioContext = null;
      }

      // Clear interval
      if (AppState.audioInterval) {
        clearInterval(AppState.audioInterval);
        AppState.audioInterval = null;
      }

      // Stop vibration
      if (navigator.vibrate) {
        navigator.vibrate(0);
      }
    }

    function playAlarmSound(alarm) {
      stopAllAudio();

      AppState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = AppState.audioContext;

      // Create gain node
      AppState.gainNode = ctx.createGain();
      AppState.gainNode.connect(ctx.destination);

      const initialVolume = alarm.fadeIn ? 0.01 : alarm.volume / 100;
      AppState.gainNode.gain.setValueAtTime(initialVolume, ctx.currentTime);

      // Create oscillator
      AppState.oscillator = ctx.createOscillator();
      AppState.oscillator.connect(AppState.gainNode);

      // Sound configurations
      const sounds = {
        digital: { freq: 880, type: 'square' },
        classic: { freq: 523.25, type: 'sine' },
        gentle: { freq: 392, type: 'sine' },
        alert: { freq: 1046.5, type: 'sawtooth' },
        emergency: { freq: 1396.91, type: 'square' },
        nature: { freq: 329.63, type: 'sine' },
        cosmic: { freq: 659.25, type: 'triangle' }
      };

      const sound = sounds[alarm.sound] || sounds.digital;
      AppState.oscillator.type = sound.type;
      AppState.oscillator.frequency.setValueAtTime(sound.freq, ctx.currentTime);
      AppState.oscillator.start();

      // Fade in
      if (alarm.fadeIn) {
        AppState.gainNode.gain.exponentialRampToValueAtTime(
          alarm.volume / 100,
          ctx.currentTime + 5
        );
      }

      // Pulsing effect
      let toggle = true;
      AppState.audioInterval = setInterval(() => {
        if (AppState.gainNode && AppState.audioContext) {
          AppState.gainNode.gain.setValueAtTime(
            toggle ? alarm.volume / 100 : (alarm.volume / 100) * 0.3,
            AppState.audioContext.currentTime
          );
        }
        toggle = !toggle;

        // Vibration
        if (alarm.vibration && navigator.vibrate) {
          navigator.vibrate(toggle ? [200, 100, 200, 100, 200] : [100, 50, 100, 50, 100]);
        }
      }, 500);
    }

    function playNotificationSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);

      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }

    // ========================================================================
    // SECTION 5: ALARM FUNCTIONS
    // Alarm CRUD operations and management
    // ========================================================================
    function checkAlarms() {
      const now = new Date();
      const currentTimeStr = now.toTimeString().slice(0, 5);
      const currentDay = now.getDay();

      AppState.alarms.forEach(alarm => {
        if (alarm.enabled && alarm.time === currentTimeStr && alarm.days.includes(currentDay)) {
          const key = `rang-${alarm.id}-${now.toDateString()}`;

          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, 'true');
            triggerAlarm(alarm);
          }
        }
      });
    }

    function triggerAlarm(alarm) {
      // Request wake lock
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }

      AppState.ringingAlarm = alarm;

      // Update UI
      const now = new Date();
      $('#ringingTime').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      $('#ringingLabel').textContent = alarm.label;
      $('#ringingDate').textContent = `${getDayName(now.getDay(), true)}, ${getMonthName(now.getMonth())} ${now.getDate()}`;

      // Show/hide mission button
      const missionBtn = $('#missionStartBtn');
      missionBtn.classList.toggle('hidden', alarm.mission === 'none');

      // Show snooze buttons
      const snoozeBtns = $('#snoozeButtons');
      snoozeBtns.innerHTML = '';

      if (alarm.snoozeEnabled) {
        [5, 10, 15, 30].forEach(mins => {
          const btn = createElement('button', 'snooze-btn', `Snooze ${mins}m`);
          btn.onclick = () => snoozeAlarm(mins);
          snoozeBtns.appendChild(btn);
        });
      }

      // Create wave visualizer
      createWaveVisualizer();

      // Create ringing particles
      createRingingParticles();

      // Show ringing screen
      $('#alarmRingingScreen').classList.add('active');

      // Play sound
      playAlarmSound(alarm);
    }

    function createWaveVisualizer() {
      const container = $('#waveVisualizer');
      container.innerHTML = '';

      for (let i = 0; i < 15; i++) {
        const bar = createElement('div', 'wave-bar');
        bar.style.animationDelay = `${i * 0.05}s`;
        bar.style.animationDuration = `${0.4 + Math.random() * 0.3}s`;
        container.appendChild(bar);
      }
    }

    function createRingingParticles() {
      const container = $('#ringingParticles');
      container.innerHTML = '';

      for (let i = 0; i < 20; i++) {
        const particle = createElement('div', 'ringing-particle');
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 1.5}s`;
        particle.style.animationDuration = `${1 + Math.random() * 1}s`;
        container.appendChild(particle);
      }
    }

    function dismissAlarm() {
      stopAllAudio();
      $('#alarmRingingScreen').classList.remove('active');
      $('#missionModal').classList.remove('active');
      AppState.ringingAlarm = null;
      AppState.missionActive = false;
      AppState.missionData = null;
      AppState.missionComplete = false;
    }

    function snoozeAlarm(minutes) {
      stopAllAudio();
      $('#alarmRingingScreen').classList.remove('active');

      // Set timeout for snooze
      setTimeout(() => {
        if (AppState.ringingAlarm) {
          triggerAlarm(AppState.ringingAlarm);
        }
      }, minutes * 60 * 1000);

      showToast('success', 'Snoozed', `Alarm will ring again in ${minutes} minutes`);
    }

    // ========================================================================
    // SECTION 6: MISSION FUNCTIONS
    // Wake-up challenge generation and checking
    // ========================================================================
    function startMission() {
      const alarm = AppState.ringingAlarm;
      if (!alarm || alarm.mission === 'none') {
        dismissAlarm();
        return;
      }

      AppState.missionActive = true;
      AppState.missionComplete = false;

      switch (alarm.mission) {
        case 'math':
          generateMathMission(alarm.difficulty);
          break;
        case 'memory':
          generateMemoryMission(alarm.difficulty);
          break;
        case 'typing':
          generateTypingMission();
          break;
        case 'pattern':
          generatePatternMission(alarm.difficulty);
          break;
        case 'rapidTap':
          generateRapidTapMission(alarm.difficulty);
          break;
        case 'shake':
          generateShakeMission(alarm.difficulty);
          break;
      }

      $('#missionModal').classList.add('active');
    }

    function generateMathMission(difficulty) {
      const levels = {
        easy: { max: 10, ops: ['+', '-'] },
        medium: { max: 50, ops: ['+', '-', '*'] },
        hard: { max: 100, ops: ['+', '-', '*'] },
        extreme: { max: 500, ops: ['+', '-', '*'] }
      };

      const level = levels[difficulty];
      const a = Math.floor(Math.random() * level.max);
      const b = Math.floor(Math.random() * level.max);
      const op = level.ops[Math.floor(Math.random() * level.ops.length)];

      let question, answer;
      if (op === '+') {
        question = `${a} + ${b}`;
        answer = a + b;
      } else if (op === '-') {
        question = `${Math.max(a, b)} - ${Math.min(a, b)}`;
        answer = Math.abs(a - b);
      } else {
        const smallB = Math.min(b, 12);
        question = `${a} × ${smallB}`;
        answer = a * smallB;
      }

      AppState.missionData = { type: 'math', question, answer };

      $('#missionModalContent').innerHTML = `
        <div class="mission-header">
          <div class="mission-icon-wrapper">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44"/>
            </svg>
          </div>
          <h2 class="mission-title">Math Challenge</h2>
          <p class="mission-subtitle">Solve the equation to dismiss the alarm</p>
        </div>
        <div class="mission-question">${question} = ?</div>
        <input type="number" class="form-input mission-input" id="mathAnswerInput" placeholder="Your answer" autofocus>
        <button class="btn btn-primary btn-block" onclick="checkMathAnswer()">Submit Answer</button>
      `;

      setTimeout(() => $('#mathAnswerInput').focus(), 100);

      $('#mathAnswerInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkMathAnswer();
      });
    }

    function checkMathAnswer() {
      const input = $('#mathAnswerInput');
      const userAnswer = parseInt(input.value);

      if (userAnswer === AppState.missionData.answer) {
        showMissionSuccess();
      } else {
        input.value = '';
        input.classList.add('animate-shake');
        setTimeout(() => input.classList.remove('animate-shake'), 600);
        generateMathMission(AppState.ringingAlarm.difficulty);
      }
    }

    function generateMemoryMission(difficulty) {
      const lengths = { easy: 4, medium: 6, hard: 8, extreme: 10 };
      const length = lengths[difficulty];

      const sequence = Array.from({ length }, () => Math.floor(Math.random() * 10));

      AppState.missionData = { type: 'memory', sequence, display: true };

      $('#missionModalContent').innerHTML = `
        <div class="mission-header">
          <div class="mission-icon-wrapper">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>

        <p style="opacity:0.6" id="memoryHint">Memorizing...</p>
      `;

      setTimeout(() => {
        $('#memoryDisplay').textContent = '_ '.repeat(length).trim();
        $('#memoryHint').textContent = 'Enter the sequence you saw';

        const input = createElement('input', 'form-input mission-input');
        input.type = 'text';
        input.id = 'memoryAnswerInput';
        input.placeholder = 'Enter sequence';
        input.maxLength = length;

        const btn = createElement('button', 'btn btn-primary btn-block', 'Submit');

        $('#memoryHint').insertAdjacentElement('afterend', input);
        input.insertAdjacentElement('afterend', btn);
        input.focus();

        AppState.missionData.display = false;

    function checkMemoryAnswer() {
      const input = $('#memoryAnswerInput');
      const userAnswer = input.value.replace(/\s/g, '');
      const correctAnswer = AppState.missionData.sequence.join('');

      if (userAnswer === correctAnswer) {
        showMissionSuccess();
      } else {
        input.value = '';
        generateMemoryMission(AppState.ringingAlarm.difficulty);

    }

              <rect width="7" height="7" x="3" y="3" rx="1"/>

              <rect width="7" height="7" x="14" y="14" rx="1"/>
              <rect width="7" height="7" x="3" y="14" rx="1"/>

        grid.insertAdjacentElement('afterend', output);

      AppState.missionData.input += emoji;
      $('#patternOutput').textContent = AppState.missionData.input;

    function generateRapidTapMission(difficulty) {
