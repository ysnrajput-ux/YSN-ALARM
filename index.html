<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>YSN SMART ALARM</title>
<meta name="theme-color" content="#00ffe1">
<link rel="manifest" id="manifestPlaceholder">
<style>
:root{--bg:#050816;--card:rgba(255,255,255,.08);--text:#fff;--accent:#00ffe1;--accent2:#7c4dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui;background:radial-gradient(circle at top,#122,#050816 70%);color:var(--text);overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
.topbar,.bottomnav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,.25);backdrop-filter:blur(20px);z-index:5}
.topbar button,.fab,.smallbtn,.navbtn,.menu button{border:none;border-radius:18px;background:var(--card);color:#fff;padding:12px 14px;font-size:15px}
.main{flex:1;overflow:auto;padding:16px 16px 100px}
.screen{display:none;animation:fade .25s}.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);padding:18px;border-radius:28px;margin-bottom:16px;box-shadow:0 0 30px rgba(0,255,225,.08)}
.clock{font-size:4rem;font-weight:900;text-align:center;margin:10px 0;background:linear-gradient(90deg,var(--accent),#fff);-webkit-background-clip:text;color:transparent}
.alarmcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bigtime{font-size:2.4rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input,select,textarea{width:100%;padding:16px;border:none;border-radius:18px;background:rgba(255,255,255,.08);color:#fff;margin:8px 0}
.fab{position:fixed;right:20px;bottom:90px;width:70px;height:70px;border-radius:50%;font-size:2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:900}
.bottomnav{position:fixed;bottom:0;width:100%;left:0}
.navbtn{flex:1;background:none}
.sheet,.menu{position:fixed;left:0;right:0;background:#0a1024;z-index:10;transition:.3s}
.sheet{bottom:-100%;border-radius:28px 28px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet.open{bottom:0}
.menu{top:-100%;padding:20px;border-radius:0 0 28px 28px}.menu.open{top:0}
.soundcard{padding:16px;border-radius:24px;background:rgba(255,255,255,.05);margin-bottom:12px}
.eq{display:flex;gap:4px;height:18px;align-items:end}.eq span{width:4px;background:var(--accent);border-radius:9px;animation:eq 1s infinite alternate}.eq span:nth-child(2){animation-delay:.2s}.eq span:nth-child(3){animation-delay:.4s}.eq span:nth-child(4){animation-delay:.6s}@keyframes eq{from{height:5px}to{height:18px}}
.timer{font-size:3rem;text-align:center;font-weight:800;padding:20px}
textarea{min-height:140px}
</style>
</head>
<body>
<div class='app'>
<div class='topbar'>
<div id='liveTime'>00:00</div>
<div class='row'>
<button onclick='toggleTheme()'>🎨</button>
<button onclick='openSounds()'>🎵</button>
<button id='installBtn'>⬇</button>
<button onclick='toggleMenu()'>⋮</button>
</div>
</div>
<div class='main'>
<div class='screen active' id='alarmScreen'>
<div class='clock' id='heroClock'></div>
<div id='alarmList'></div>
</div>
<div class='screen' id='timerScreen'>
<div class='card'><div class='timer' id='timerDisplay'>25:00</div>
<div class='row'><button class='smallbtn' onclick='startTimer()'>Start</button><button class='smallbtn' onclick='pauseTimer()'>Pause</button><button class='smallbtn' onclick='resetTimer()'>Reset</button></div></div>
</div>
<div class='screen' id='stopwatchScreen'>
<div class='card'><div class='timer' id='swDisplay'>00:00:00</div>
<div class='row'><button class='smallbtn' onclick='startSW()'>Start</button><button class='smallbtn' onclick='stopSW()'>Stop</button><button class='smallbtn' onclick='resetSW()'>Reset</button><button class='smallbtn' onclick='lapSW()'>Lap</button></div><div id='laps'></div></div>
</div>
<div class='screen' id='clockScreen'>
<div class='card'><h2>🌍 World Clock</h2><div id='world'></div></div>
</div>
<div class='screen' id='moreScreen'>
<div class='card'><h2>📝 Notes</h2><textarea id='notes'></textarea><button class='smallbtn' onclick='saveNotes()'>Save Notes</button></div>
</div>
</div>
<button class='fab' onclick='openAlarmSheet()'>+</button>
<div class='bottomnav'>
<button class='navbtn' onclick='showScreen("alarmScreen")'>⏰</button>
<button class='navbtn' onclick='showScreen("timerScreen")'>⏳</button>
<button class='navbtn' onclick='showScreen("stopwatchScreen")'>⌚</button>
<button class='navbtn' onclick='showScreen("clockScreen")'>🌍</button>
<button class='navbtn' onclick='showScreen("moreScreen")'>☰</button>
</div>
</div>
<div class='menu' id='menu'>
<div class='row'><button onclick='applyTheme("amoled")'>AMOLED</button><button onclick='applyTheme("light")'>Light</button><button onclick='applyTheme("matrix")'>Matrix</button><button onclick='applyTheme("neon")'>Neon</button></div>
<div class='row' style='margin-top:12px'><button onclick='openSounds()'>Sounds</button><button onclick='showScreen("moreScreen")'>Notes</button><button onclick='showScreen("timerScreen")'>Focus</button></div>
</div>
<div class='sheet' id='alarmSheet'>
<h2>Create Smart Alarm</h2>
<input type='time' class='input' id='alarmTime'>
<input class='input' id='alarmLabel' placeholder='Alarm Label'>
<select id='repeat' class='input'><option>Daily</option><option>Monday-Friday</option><option>Weekend</option><option>One Time</option></select>
<select id='soundSelect' class='input'></select>
<div class='row'><button class='smallbtn' onclick='saveAlarm()'>Save Alarm</button><button class='smallbtn' onclick='closeSheet()'>Close</button></div>
</div>
<div class='sheet' id='soundSheet'>
<h2>Premium Sounds</h2>
<div id='soundList'></div>
</div>
<script>
const sounds=[
{name:'Radar',type:'sine',freq:440},{name:'Reflection',type:'triangle',freq:540},{name:'Silk',type:'sine',freq:320},{name:'Night Owl',type:'square',freq:240},
{name:'Morning Flower',type:'triangle',freq:460},{name:'Calm Galaxy',type:'sine',freq:370},{name:'Digital Rise',type:'sawtooth',freq:620},
{name:'Glyph Pulse',type:'square',freq:700},{name:'Neon Air',type:'triangle',freq:560},
{name:'Rain',type:'noise',freq:150},{name:'Ocean',type:'noise',freq:100},{name:'Birds',type:'sine',freq:900},
{name:'Emergency',type:'square',freq:980},{name:'Siren',type:'sawtooth',freq:850},{name:'Heavy Bell',type:'triangle',freq:740}
];
let alarms=JSON.parse(localStorage.getItem('alarms')||'[]');
let editing=null;let currentAudio=null;let deferredPrompt;
const alarmList=document.getElementById('alarmList');
const soundList=document.getElementById('soundList');
const soundSelect=document.getElementById('soundSelect');
function renderSounds(){soundList.innerHTML='';soundSelect.innerHTML='';sounds.forEach(s=>{soundSelect.innerHTML+=`<option>${s.name}</option>`;soundList.innerHTML+=`<div class='soundcard'><div class='row'><div><b>${s.name}</b><div class='eq'><span></span><span></span><span></span><span></span></div></div><button class='smallbtn' onclick='previewSound("${s.name}")'>▶ Preview</button><button class='smallbtn' onclick='selectSound("${s.name}")'>✓ Select</button></div></div>`})}
renderSounds();
function previewSound(name){stopSound();const s=sounds.find(x=>x.name===name);const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=s.type==='noise'?'sine':s.type;osc.frequency.value=s.freq;osc.connect(gain);gain.connect(ctx.destination);gain.gain.value=.08;osc.start();if(s.type==='noise'){const lfo=ctx.createOscillator();lfo.frequency.value=8;lfo.connect(osc.frequency);lfo.start()}
if(name==='Siren'){let up=true;var iv=setInterval(()=>{osc.frequency.value=up?1000:500;up=!up},300);setTimeout(()=>clearInterval(iv),2500)}
currentAudio={ctx,osc};setTimeout(stopSound,2500)}
function stopSound(){if(currentAudio){try{currentAudio.osc.stop()}catch(e){} currentAudio.ctx.close();currentAudio=null}}
function selectSound(name){soundSelect.value=name;previewSound(name)}
function renderAlarms(){alarmList.innerHTML='';alarms.forEach((a,i)=>{alarmList.innerHTML+=`<div class='card alarmcard'><div><div class='bigtime'>${a.time}</div><div>${a.label}</div><small>${a.repeat} • ${a.sound}</small></div><div class='row'><input type='checkbox' ${a.active?'checked':''} onchange='toggleAlarm(${i})'><button class='smallbtn' onclick='editAlarm(${i})'>Edit</button><button class='smallbtn' onclick='deleteAlarm(${i})'>Delete</button><button class='smallbtn' onclick='previewSound("${a.sound}")'>▶</button></div></div>`})
localStorage.setItem('alarms',JSON.stringify(alarms))}
renderAlarms();
function openAlarmSheet(){document.getElementById('alarmSheet').classList.add('open')}
function closeSheet(){document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'))}
function openSounds(){document.getElementById('soundSheet').classList.add('open')}
function saveAlarm(){const obj={time:alarmTime.value,label:alarmLabel.value||'Smart Alarm',repeat:repeat.value,sound:soundSelect.value,active:true};if(editing!==null){alarms[editing]=obj;editing=null}else alarms.push(obj);renderAlarms();closeSheet()}
function deleteAlarm(i){alarms.splice(i,1);renderAlarms()}
function editAlarm(i){const a=alarms[i];editing=i;alarmTime.value=a.time;alarmLabel.value=a.label;repeat.value=a.repeat;soundSelect.value=a.sound;openAlarmSheet()}
function toggleAlarm(i){alarms[i].active=!alarms[i].active;renderAlarms()}
setInterval(()=>{const d=new Date();const t=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});liveTime.innerText=t;heroClock.innerText=t;alarms.forEach(a=>{if(a.active&&a.time===d.toTimeString().slice(0,5)){previewSound(a.sound);alert('⏰ '+a.label)}})},1000)
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');toggleMenu(false)}
function toggleMenu(force){const m=document.getElementById('menu');if(force===false){m.classList.remove('open');return}m.classList.toggle('open')}
let themes={amoled:['#000','#00ffe1'],light:['#f4f4f4','#2563eb'],matrix:['#001500','#00ff66'],neon:['#050816','#ff00ff']}
function applyTheme(t){document.body.style.background=themes[t][0];document.documentElement.style.setProperty('--accent',themes[t][1]);localStorage.setItem('theme',t)}
function toggleTheme(){let arr=['amoled','light','matrix','neon'];let c=localStorage.getItem('theme')||'amoled';applyTheme(arr[(arr.indexOf(c)+1)%arr.length])}
applyTheme(localStorage.getItem('theme')||'amoled');
let timer=1500,timerInt;function renderTimer(){let m=String(Math.floor(timer/60)).padStart(2,'0');let s=String(timer%60).padStart(2,'0');timerDisplay.innerText=`${m}:${s}`}
renderTimer();function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{timer--;renderTimer();if(timer<=0){clearInterval(timerInt);previewSound('Emergency')}},1000)}
function pauseTimer(){clearInterval(timerInt)}function resetTimer(){timer=1500;renderTimer()}
let sw=0,swInt;function updateSW(){let h=String(Math.floor(sw/3600)).padStart(2,'0');let m=String(Math.floor(sw/60)%60).padStart(2,'0');let s=String(sw%60).padStart(2,'0');swDisplay.innerText=`${h}:${m}:${s}`}
function startSW(){clearInterval(swInt);swInt=setInterval(()=>{sw++;updateSW()},1000)}function stopSW(){clearInterval(swInt)}function resetSW(){sw=0;updateSW();laps.innerHTML=''}function lapSW(){laps.innerHTML+=`<div>${swDisplay.innerText}</div>`}
function saveNotes(){localStorage.setItem('notes',notes.value)}notes.value=localStorage.getItem('notes')||'';
world.innerHTML=`<div>🇮🇳 India: ${new Date().toLocaleTimeString('en-IN')}</div><div>🇺🇸 USA: ${new Date().toLocaleTimeString('en-US')}</div><div>🇯🇵 Japan: ${new Date().toLocaleTimeString('ja-JP')}</div>`;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e})
installBtn.onclick=()=>{if(deferredPrompt)deferredPrompt.prompt();else alert('Use Add to Home Screen')}
const manifest={name:'YSN SMART ALARM',short_name:'YSN Alarm',display:'standalone',start_url:'./',background_color:'#000',theme_color:'#00ffe1',icons:[{src:'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="100%" height="100%" fill="black"/><text x="50%" y="52%" font-size="90" fill="cyan" text-anchor="middle">⏰</text></svg>'),sizes:'512x512',type:'image/svg+xml'}]};
manifestPlaceholder.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
if('serviceWorker' in navigator){const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('offline'))))`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'})))}
</script>
</body>
</html>
