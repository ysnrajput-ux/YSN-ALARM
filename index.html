    function handleRapidTap() {
      AppState.missionData.current++;
      const progress = AppState.missionData.current / AppState.missionData.target;
      const offset = 565 - (progress * 565);

      $('#rapidCount').textContent = AppState.missionData.current;
      $('#rapidProgress').setAttribute('stroke-dashoffset', offset);

      // Add haptic feedback
      if (navigator.vibrate) {
        navigator.vibrate(10);
      }

      if (AppState.missionData.current >= AppState.missionData.target) {
        showMissionSuccess();

    }

    function generateShakeMission(difficulty) {
      const targets = { easy: 5, medium: 10, hard: 20, extreme: 30 };
      const target = targets[difficulty];

      AppState.missionData = { type: 'shake', target, current: 0 };

      $('#missionModalContent').innerHTML = `
        <div class="mission-header">
          <div class="mission-icon-wrapper">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
              <path d="M12 18h.01"/>
            </svg>
          </div>
          <h2 class="mission-title">Shake Challenge</h2>
          <p class="mission-subtitle">Shake your phone ${target} times!</p>
        </div>
        <div class="progress-circle">
          <svg width="200" height="200" viewBox="0 0 200 200">
            <circle class="progress-circle-bg" cx="100" cy="100" r="90"/>
            <circle class="progress-circle-active" id="shakeProgress" cx="100" cy="100" r="90"
                    stroke-dasharray="565" stroke-dashoffset="565"/>
          </svg>
          <div class="progress-circle-text">
            <span id="shakeCount">0</span><br>
            <span class="progress-circle-label">/ ${target}</span>
          </div>
        </div>
        <button class="btn btn-primary btn-block" onclick="handleShakeTap()">Tap to simulate shake</button>
      `;

      // Setup device motion listener
      if (window.DeviceMotionEvent) {
        let lastAcceleration = { x: 0, y: 0, z: 0 };
        let shakeCount = 0;

        window.addEventListener('devicemotion', (e) => {
          const acc = e.accelerationIncludingGravity;
          if (!acc) return;

          const deltaX = Math.abs(acc.x - lastAcceleration.x);
          const deltaY = Math.abs(acc.y - lastAcceleration.y);
          const deltaZ = Math.abs(acc.z - lastAcceleration.z);

          if (deltaX + deltaY + deltaZ > 30) {
            shakeCount++;
            if (shakeCount % 3 === 0) {
              handleShakeTap();
            }
          }

          lastAcceleration = { x: acc.x || 0, y: acc.y || 0, z: acc.z || 0 };
        });
      }
    }

    function handleShakeTap() {
      AppState.missionData.current++;
      const progress = AppState.missionData.current / AppState.missionData.target;
      const offset = 565 - (progress * 565);

      $('#shakeCount').textContent = AppState.missionData.current;

    function showAddAlarm() {
      AppState.editingAlarm = null;

      $('#modalTitle').textContent = 'Add Alarm';
      $('#alarmTimeInput').value = '08:00';
      $('#alarmLabelInput').value = '';

      // Reset day picker
      $$('#dayPicker .chip').forEach(chip => {
        const day = parseInt(chip.dataset.day);
        chip.classList.toggle('active', day >= 1 && day <= 5);
      });

      // Reset sound picker
      $$('#soundPicker .chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.sound === 'digital');
      });

      // Reset mission picker
      $$('#missionPicker .chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.mission === 'none');
      });
      $('#difficultyGroup').classList.add('hidden');

      // Reset volume
      $('#volumeSlider').value = 80;
      $('#volumeValue').textContent = '80';

      // Reset snooze picker
      $$('#snoozePicker .chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.snooze === '5');
      });

      // Reset toggles
      $('#vibrationToggle').classList.add('active');
      $('#fadeInToggle').classList.add('active');
      $('#repeatToggle').classList.add('active');

      $('#alarmModal').classList.add('active');
    }

    function editAlarm(id) {
      const alarm = AppState.alarms.find(a => a.id === id);
      if (!alarm) return;

      AppState.editingAlarm = alarm;

      $('#modalTitle').textContent = 'Edit Alarm';
      $('#alarmTimeInput').value = alarm.time;
      $('#alarmLabelInput').value = alarm.label || '';

      // Set day picker
      $$('#dayPicker .chip').forEach(chip => {
        chip.classList.toggle('active', alarm.days.includes(parseInt(chip.dataset.day)));
      });

      // Set sound picker
      $$('#soundPicker .chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.sound === alarm.sound);
      });

      // Set mission picker
      $$('#missionPicker .chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.mission === alarm.mission);
      });
      $('#difficultyGroup').classList.toggle('hidden', alarm.mission === 'none');

      // Set difficulty
      $$('#difficultyPicker .chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.difficulty === alarm.difficulty);
      });

      // Set volume
      $('#volumeSlider').value = alarm.volume;
      $('#volumeValue').textContent = alarm.volume;

      // Set snooze
      $$('#snoozePicker .chip').forEach(chip => {
        chip.classList.toggle('active', parseInt(chip.dataset.snooze) === alarm.snoozeTime);
      });

      // Set toggles
      alarm.vibration ? $('#vibrationToggle').classList.add('active') : $('#vibrationToggle').classList.remove('active');
      alarm.fadeIn ? $('#fadeInToggle').classList.add('active') : $('#fadeInToggle').classList.remove('active');
      alarm.repeat ? $('#repeatToggle').classList.add('active') : $('#repeatToggle').classList.remove('active');

      $('#alarmModal').classList.add('active');
    }

    function saveAlarm() {
      const days = Array.from($$('#dayPicker .chip.active')).map(c => parseInt(c.dataset.day));
      const sound = document.querySelector('#soundPicker .chip.active')?.dataset.sound || 'digital';
      const mission = document.querySelector('#missionPicker .chip.active')?.dataset.mission || 'none';
      const difficulty = document.querySelector('#difficultyPicker .chip.active')?.dataset.difficulty || 'medium';
      const snoozeTime = parseInt(document.querySelector('#snoozePicker .chip.active')?.dataset.snooze || '5');

      const alarm = {
        id: AppState.editingAlarm?.id || generateId(),
        time: $('#alarmTimeInput').value,
        label: $('#alarmLabelInput').value || 'Alarm',
        enabled: AppState.editingAlarm?.enabled ?? true,
        days,
        sound,
        mission,
        difficulty,
        volume: parseInt($('#volumeSlider').value),
        snoozeEnabled: true,
        snoozeTime,
        vibration: $('#vibrationToggle').classList.contains('active'),
        fadeIn: $('#fadeInToggle').classList.contains('active'),
        repeat: $('#repeatToggle').classList.contains('active')
      };

      if (AppState.editingAlarm) {
        AppState.alarms = AppState.alarms.map(a => a.id === alarm.id ? alarm : a);
      } else {
        AppState.alarms.push(alarm);
      }

      saveToStorage('alarms', AppState.alarms);
      renderAlarms();
      $('#alarmModal').classList.remove('active');

      showToast('success', AppState.editingAlarm ? 'Alarm Updated' : 'Alarm Created', `Alarm set for ${alarm.time}`);
    }

    function toggleAlarm(id) {
      AppState.alarms = AppState.alarms.map(a =>
        a.id === id ? { ...a, enabled: !a.enabled } : a
      );
      saveToStorage('alarms', AppState.alarms);
      renderAlarms();
    }

    function deleteAlarm(id) {
      if (confirm('Delete this alarm?')) {
        AppState.alarms = AppState.alarms.filter(a => a.id !== id);
        saveToStorage('alarms', AppState.alarms);
        renderAlarms();
        showToast('info', 'Alarm Deleted', 'The alarm has been removed');
      }
    }

    // ========================================================================
    // SECTION 9: TIMER FUNCTIONS
    // Timer control operations
    // ========================================================================
    function setTimerPreset(seconds) {
      AppState.timer.seconds = seconds;
      AppState.timer.initialSeconds = seconds;
      renderTimer();
    }

    function startTimer() {
      if (AppState.timer.seconds <= 0) return;

      // Check manual input
      const manualInput = $('#timerManualInput');
      if (manualInput && manualInput.value) {
        AppState.timer.seconds = parseInt(manualInput.value) * 60;
        AppState.timer.initialSeconds = AppState.timer.seconds;
      }

      AppState.timer.running = true;
      renderTimer();

      AppState.intervals.timer = setInterval(() => {
        AppState.timer.seconds--;
        const display = $('#timerDisplay');
        if (display) display.textContent = formatTime(AppState.timer.seconds);

        if (AppState.timer.seconds <= 0) {
          clearInterval(AppState.intervals.timer);
          AppState.timer.running = false;
          playNotificationSound();
          showToast('success', 'Timer Complete', 'Your timer has finished!');
          renderTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      AppState.timer.running = false;
      clearInterval(AppState.intervals.timer);
      renderTimer();
    }

    function resetTimer() {
      AppState.timer.running = false;
      AppState.timer.seconds = 0;
      clearInterval(AppState.intervals.timer);
      renderTimer();
    }

    // SECTION 10: STOPWATCH FUNCTIONS
    // Stopwatch control operations
    // ========================================================================
    function startStopwatch() {
      AppState.stopwatch.running = true;
      renderStopwatch();

      AppState.intervals.stopwatch = setInterval(() => {
        AppState.stopwatch.milliseconds += 10;
        const display = $('#stopwatchDisplay');
        if (display) display.textContent = formatStopwatch(AppState.stopwatch.milliseconds);
      }, 10);
    }

    function pauseStopwatch() {
      AppState.stopwatch.running = false;
      clearInterval(AppState.intervals.stopwatch);
      renderStopwatch();
    }

    function lapStopwatch() {
      AppState.stopwatch.laps.push(AppState.stopwatch.milliseconds);
      renderStopwatch();
    }

    function resetStopwatch() {
      AppState.stopwatch.running = false;
      AppState.stopwatch.milliseconds = 0;
      AppState.stopwatch.laps = [];
      clearInterval(AppState.intervals.stopwatch);
      renderStopwatch();

        { city: 'Los Angeles', timezone: 'America/Los_Angeles' },
        { city: 'Chicago', timezone: 'America/Chicago' },
        { city: 'Toronto', timezone: 'America/Toronto' }
      ];

      const available = cities.filter(c =>
        !AppState.worldClocks.find(w => w.city === c.city)
      );

      if (available.length === 0) {
        showToast('warning', 'All cities added', 'No more cities available');
        return;
      }

      const newCity = available[Math.floor(Math.random() * available.length)];
      AppState.worldClocks.push({
        id: generateId(),
        ...newCity
      });

      saveToStorage('worldclocks', AppState.worldClocks);
      renderWorldClocks();
      showToast('success', 'City Added', `${newCity.city} added to world clocks`);
    }

    // ========================================================================
    // SECTION 12: POMODORO FUNCTIONS
    // Pomodoro timer control
    // ========================================================================
    function togglePomodoro() {
      if (AppState.pomodoro.running) {
        AppState.pomodoro.running = false;
        clearInterval(AppState.intervals.pomodoro);
      } else {
        AppState.pomodoro.running = true;

        AppState.intervals.pomodoro = setInterval(() => {
          AppState.pomodoro.time--;
          saveToStorage('pomodoro', AppState.pomodoro);
          renderTools();

          if (AppState.pomodoro.time <= 0) {
            clearInterval(AppState.intervals.pomodoro);
            playNotificationSound();

            // Switch mode
            if (AppState.pomodoro.mode === 'work') {
              AppState.pomodoro.mode = 'break';
              AppState.pomodoro.time = AppState.pomodoro.breakDuration * 60;
              AppState.pomodoro.sessions++;
              if (AppState.pomodoro.sessions >= 4) {
                AppState.pomodoro.totalSessions++;
                AppState.pomodoro.sessions = 0;
              }
            } else {
              AppState.pomodoro.mode = 'work';
              AppState.pomodoro.time = AppState.pomodoro.workDuration * 60;
            }

            showToast('info',
              AppState.pomodoro.mode === 'work' ? 'Work Time!' : 'Break Time!',
              'Pomodoro session complete'
            );

            AppState.pomodoro.running = false;
            saveToStorage('pomodoro', AppState.pomodoro);
            renderTools();
          }
        }, 1000);
      }

      saveToStorage('pomodoro', AppState.pomodoro);
      renderTools();
    }

    function resetPomodoro() {
      AppState.pomodoro = {
        mode: 'work',
        time: 25 * 60,
        workDuration: 25,
        breakDuration: 5,
        sessions: 0,
        totalSessions: AppState.pomodoro.totalSessions
      };
      clearInterval(AppState.intervals.pomodoro);
      saveToStorage('pomodoro', AppState.pomodoro);
      renderTools();
    }

    // ========================================================================
    // SECTION 13: FOCUS MODE FUNCTIONS
    // Focus mode control
    // ========================================================================
    function startFocusMode() {
      const duration = parseInt($('#focusDuration').value) || 25;
      AppState.focusMode.active = true;
      AppState.focusMode.duration = duration;
      AppState.focusMode.remaining = duration * 60;
      renderTools();

      AppState.intervals.focus = setInterval(() => {
        AppState.focusMode.remaining--;
        renderTools();

        if (AppState.focusMode.remaining <= 0) {
          clearInterval(AppState.intervals.focus);
          AppState.focusMode.active = false;
          playNotificationSound();
          showToast('success', 'Focus Complete!', `Great job! You focused for ${duration} minutes`);
          renderTools();
        }
      }, 1000);
    }

    function endFocusMode() {
      AppState.focusMode.active = false;
      clearInterval(AppState.intervals.focus);
      showToast('warning', 'Focus Ended', 'Focus mode has been stopped');
      renderTools();
    }

    // ========================================================================
    // SECTION 14: WATER TRACKER FUNCTIONS
    // Water intake tracking
    // ========================================================================
    function setWaterGlasses(count) {
      AppState.water.glasses = count;
      saveToStorage('water', AppState.water);
      renderTools();
    }

    function adjustWater(delta) {
      AppState.water.glasses = Math.max(0, Math.min(AppState.water.goal, AppState.water.glasses + delta));
      saveToStorage('water', AppState.water);
      renderTools();
    }

    // ========================================================================
    // SECTION 15: HABIT TRACKER FUNCTIONS
    // Habit tracking operations
    // ========================================================================
    function toggleHabit(id) {
      const today = new Date().toDateString();

      AppState.habits = AppState.habits.map(h => {
        if (h.id === id) {
          const completedDays = h.completedDays || [];
          const isCompleted = completedDays.includes(today);
          const newCompletedDays = isCompleted
            ? completedDays.filter(d => d !== today)
            : [...completedDays, today];

          // Calculate streak
          let streak = 0;
          if (!isCompleted) {
            const sorted = newCompletedDays.sort((a, b) => new Date(b) - new Date(a));
            for (let i = 0; i < sorted.length; i++) {
              const checkDate = new Date();
              checkDate.setDate(checkDate.getDate() - i);
              if (sorted.includes(checkDate.toDateString())) {
                streak++;
              } else break;
            }
          }

          return { ...h, completedDays: newCompletedDays, streak };
        }
        return h;
      });

      saveToStorage('habits', AppState.habits);
      renderTools();
    }

    // ========================================================================
    // SECTION 16: NOTES FUNCTIONS
    // Quick notes management
    // ========================================================================
    function addNote() {
      const input = $('#noteInput');
      if (!input.value.trim()) return;

      AppState.notes.push({
        id: generateId(),
        content: input.value.trim(),
        timestamp: Date.now()
      });

      input.value = '';
      saveToStorage('notes', AppState.notes);
      renderTools();
    }

    function deleteNote(id) {
      AppState.notes = AppState.notes.filter(n => n.id !== id);
      saveToStorage('notes', AppState.notes);
      renderTools();
    }

    // ========================================================================
    // SECTION 17: TOAST NOTIFICATIONS
    // Toast message system
    // ========================================================================
    function showToast(type, title, message) {
      const container = $('#toastContainer');
      const icons = {
        success: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        error: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        warning: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };

      const toast = createElement('div', 'toast', `
        <div class="toast-icon ${type}">${icons[type]}</div>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          <div class="toast-message">${message}</div>
        </div>
      `);

      container.appendChild(toast);

      setTimeout(() => toast.classList.add('visible'), 10);

      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // ========================================================================
    // SECTION 18: PARTICLES SYSTEM
    // Background particle animations
    // ========================================================================
    function createParticles() {
      const container = $('#particles');
      if (!container) return;

      for (let i = 0; i < 20; i++) {
        const particle = createElement('div', 'particle');
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.bottom = '-10px';
        particle.style.animationDuration = `${15 + Math.random() * 20}s`;
        particle.style.animationDelay = `${Math.random() * 15}s`;
        particle.style.width = `${3 + Math.random() * 4}px`;
        particle.style.height = particle.style.width;
        container.appendChild(particle);
      }
    }

    // ========================================================================
    // SECTION 19: CLOCK UPDATE
    // Main time display update
    // ========================================================================
    function updateClock() {
      const now = new Date();

      // Update main time
      $('#mainTime').textContent = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      $('#mainSeconds').textContent = now.getSeconds().toString().padStart(2, '0');

      // Update date
      $('#mainDay').textContent = getDayName(now.getDay(), true);
      $('#mainFullDate').textContent = `${getMonthName(now.getMonth())} ${now.getDate()}, ${now.getFullYear()}`;

      // Update world clocks
      AppState.worldClocks.forEach(clock => {
        const el = $(`#worldClock-${clock.id}`);
        if (el) {
          el.textContent = formatWorldClockTime(clock.timezone);
        }
      });
    }

    // ========================================================================
    // SECTION 20: PWA INSTALLATION
    // Progressive Web App installation handling
    // ========================================================================
    function setupPWA() {
      // Check if already installed
      if (window.matchMedia('(display-mode: standalone)').matches) {
        AppState.isInstalled = true;
        return;
      }

      // Listen for install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        AppState.installPrompt = e;
        $('#installBanner').classList.add('visible');
      });

      // Install button
      $('#installBtn').addEventListener('click', async () => {
        if (!AppState.installPrompt) return;

        AppState.installPrompt.prompt();
        const result = await AppState.installPrompt.userChoice;

        if (result.outcome === 'accepted') {
          $('#installBanner').classList.remove('visible');
          showToast('success', 'App Installed!', 'YSN Smart Alarm is now on your home screen');
        }

        AppState.installPrompt = null;
      });
    }

    // ========================================================================
    // SECTION 21: SERVICE WORKER REGISTRATION
    // Offline support registration
    // ========================================================================
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'ysn-alarm-v2';

          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });

          self.addEventListener('activate', (e) => {
            e.waitUntil(self.clients.claim());
          });

          self.addEventListener('fetch', (e) => {
            e.respondWith(
              fetch(e.request)
                .then(res => {
                  const clone = res.clone();
                  caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));
                  return res;
                })
                .catch(() => caches.match(e.request))
            );
          });
        `;

        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl).catch(err => {
          // Silent fail for inline service worker
        });
      }
    }

    // ========================================================================
    // SECTION 22: EVENT LISTENERS SETUP
    // Initialize all event handlers
    // ========================================================================
    function setupEventListeners() {
      // Theme button
      $('#themeBtn').addEventListener('click', () => {
        $('#themePanel').classList.toggle('active');
      });

      // Theme panel items
      $$('.theme-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const theme = btn.dataset.theme;
          AppState.theme = theme;
          document.getElementById('app').setAttribute('data-theme', theme);
          localStorage.setItem('ysn-theme', theme);

          $$('.theme-option').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          $('#themePanel').classList.remove('active');

          showToast('success', 'Theme Changed', `Switched to ${theme} theme`);
        });
      });

      // Close theme panel on outside click
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.theme-button') && !e.target.closest('.theme-panel')) {
          $('#themePanel').classList.remove('active');
        }
      });

      // Navigation tabs
      $$('.nav-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          AppState.currentTab = tab;

          $$('.nav-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          $$('.tab-content').forEach(c => c.classList.remove('active'));
          $(`#tab-${tab}`).classList.add('active');

          // Re-render tab content
          if (tab === 'alarms') renderAlarms();
          if (tab === 'timer') renderTimer();
          if (tab === 'stopwatch') renderStopwatch();
          if (tab === 'worldclock') renderWorldClocks();
          if (tab === 'tools') renderTools();
        });
      });

      // Modal close buttons
      $('#closeModalBtn').addEventListener('click', () => {
        $('#alarmModal').classList.remove('active');
      });

      $('#cancelAlarmBtn').addEventListener('click', () => {
        $('#alarmModal').classList.remove('active');
      });

      // Save alarm button
      $('#saveAlarmBtn').addEventListener('click', saveAlarm);

      // Volume slider
      $('#volumeSlider').addEventListener('input', (e) => {
        $('#volumeValue').textContent = e.target.value;
      });

      // Day picker
      $$('#dayPicker .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          chip.classList.toggle('active');
        });
      });

      // Sound picker
      $$('#soundPicker .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          $$('#soundPicker .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });
      });

      // Mission picker
      $$('#missionPicker .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          $$('#missionPicker .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');

          // Show/hide difficulty
          $('#difficultyGroup').classList.toggle('hidden', chip.dataset.mission === 'none');
        });
      });

      // Difficulty picker
      $$('#difficultyPicker .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          $$('#difficultyPicker .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });
      });

      // Snooze picker
      $$('#snoozePicker .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          $$('#snoozePicker .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });
      });

      // Toggles
      $('#vibrationToggle').addEventListener('click', function() {
        this.classList.toggle('active');
      });

      $('#fadeInToggle').addEventListener('click', function() {
        this.classList.toggle('active');
      });

      $('#repeatToggle').addEventListener('click', function() {
        this.classList.toggle('active');
      });

      // Alarm ringing buttons
      $('#dismissAlarmBtn').addEventListener('click', dismissAlarm);
      $('#missionStartBtn').addEventListener('click', startMission);

      // Note input enter key
      $('#noteInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addNote();
      });

      // Prevent zoom on double tap
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Handle visibility change
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          // Pause unnecessary operations
        } else {
          // Resume operations
          updateClock();
        }
      });
    }

    // ========================================================================
    // SECTION 23: APPLICATION INITIALIZATION
    // Main initialization function
    // ========================================================================
    function init() {
      // Set initial theme
      document.getElementById('app').setAttribute('data-theme', AppState.theme);
      $$('.theme-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === AppState.theme);
      });

      // Create particles
      createParticles();

      // Setup event listeners
      setupEventListeners();

      // Setup PWA
      setupPWA();

      // Register service worker
      registerServiceWorker();

      // Initial renders
      renderAlarms();
      renderTimer();
      renderStopwatch();
      renderWorldClocks();
      renderTools();

      // Start clock
      updateClock();
      AppState.intervals.clock = setInterval(updateClock, 1000);

      // Start alarm checker
      AppState.intervals.alarmCheck = setInterval(checkAlarms, 1000);

      // Check water date
      if (AppState.water.lastUpdated !== new Date().toDateString()) {
        AppState.water.glasses = 0;
        AppState.water.lastUpdated = new Date().toDateString();
        saveToStorage('water', AppState.water);
      }

      console.log('YSN Smart Alarm initialized successfully');
    }

    // Start the application
    init();
  </script>
